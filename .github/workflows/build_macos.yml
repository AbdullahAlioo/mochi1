name: Build Mochi Companion (macOS & Windows)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release (.app)
        run: flutter build macos --release

      - name: Package App into Single .DMG Installer File
        run: |
          cd build/macos/Build/Products/Release
          mkdir dmg_root
          cp -r bot_companion.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Mochi Companion" -srcfolder dmg_root -ov -format UDZO Mochi-Companion-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-Companion-macOS-DMG
          path: build/macos/Build/Products/Release/Mochi-Companion-macOS.dmg
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Mochi Desktop Companion v1.0.0"
          body: |
            ### Official Download for macOS
            1. Download **`Mochi-Companion-macOS.dmg`** below.
            2. Double-click the file and drag **bot_companion** into **Applications**.
            3. Plug Mochi into your Mac via USB and run!
          files: build/macos/Build/Products/Release/Mochi-Companion-macOS.dmg
